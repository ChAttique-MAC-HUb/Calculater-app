<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calc" aria-label="Calculator">
    <div class="display" aria-live="polite">
      <div class="history" id="history"></div>
      <div class="current" id="current">0</div>
    </div>
    <div class="keys">
      <button data-action="clear" class="fn">AC</button>
      <button data-action="sign" class="fn">±</button>
      <button data-action="percent" class="fn">%</button>
      <button data-op="÷" class="op">÷</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button data-op="×" class="op">×</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button data-op="−" class="op">−</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button data-op="+" class="op">+</button>

      <button data-action="back" class="fn" aria-label="Backspace">⌫</button>
      <button data-num="0">0</button>
      <button data-action="dot">.</button>
      <button data-action="equals" class="eq">=</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
